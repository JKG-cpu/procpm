[project]
name = "procpm"
version = "0.1.0"
description = "A developer tool that manages an entire software project and all of the programs/services that belong to it."
readme = "README.md"
authors = [
    { name = "JKG-cpu", email = "jkg66512@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
procpm = "procpm:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
]
